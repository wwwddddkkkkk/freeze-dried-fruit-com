<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How to tell fruit powder from fruit juice powder on an ingredient list</title>
  <desc id="desc">Two process routes shown side by side: whole fruit dried then milled into a single-ingredient powder, versus pressed juice combined with a carrier and spray dried into a carrier-added powder, with the resulting ingredient statements and a bar comparing fruit solids to carrier.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">LABELS &amp; QUALITY</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">Two Powders, Two Different Ingredients</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">The carrier in the bracket is the tell.</text>

  <!-- Left: whole fruit route -->
  <g transform="translate(112,290)">
    <rect x="0" y="0" width="656" height="316" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="40" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">WHOLE FRUIT POWDER</text>
    <text x="24" y="66" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">dried as a solid, then milled</text>

    <g transform="translate(30,92)">
      <circle cx="46" cy="46" r="42" fill="#f5c9c4" stroke="#c05a52" stroke-width="2"/>
      <path d="M46,10 C34,26 34,66 46,82" fill="none" stroke="#c05a52" stroke-width="2"/>
      <text x="46" y="112" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">whole fruit</text>
      <polygon points="106,40 130,48 106,56" fill="#7a8a86"/>

      <rect x="142" y="16" width="92" height="60" rx="8" fill="#eef4f0" stroke="#2f6f63" stroke-width="2"/>
      <text x="188" y="52" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">freeze-dry</text>
      <text x="188" y="112" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">no stickiness problem</text>
      <polygon points="246,40 270,48 246,56" fill="#7a8a86"/>

      <rect x="282" y="16" width="92" height="60" rx="8" fill="#eef4f0" stroke="#2f6f63" stroke-width="2"/>
      <text x="328" y="52" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">mill</text>
      <text x="328" y="112" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">fibre retained</text>
      <polygon points="386,40 410,48 386,56" fill="#7a8a86"/>

      <rect x="422" y="16" width="146" height="60" rx="8" fill="#f5c9c4" stroke="#c05a52" stroke-width="2"/>
      <text x="495" y="52" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">fruit powder</text>
    </g>

    <rect x="30" y="228" width="596" height="62" rx="8" fill="#f4efe6" stroke="#c8bda8" stroke-width="2"/>
    <text x="48" y="254" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="12.5" letter-spacing="2">INGREDIENT STATEMENT</text>
    <text x="48" y="280" fill="#172f2b" font-family="'Source Serif 4', Georgia, serif" font-size="18">Freeze-dried strawberry powder.</text>
  </g>

  <!-- Right: juice route -->
  <g transform="translate(800,290)">
    <rect x="0" y="0" width="640" height="316" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="40" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">FRUIT JUICE POWDER</text>
    <text x="24" y="66" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">pressed first, then dried onto a carrier</text>

    <g transform="translate(30,92)">
      <circle cx="42" cy="46" r="38" fill="#f5c9c4" stroke="#c05a52" stroke-width="2"/>
      <text x="42" y="112" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">press</text>
      <polygon points="96,40 120,48 96,56" fill="#7a8a86"/>

      <rect x="132" y="16" width="86" height="60" rx="8" fill="#fdf3e3" stroke="#c79a56" stroke-width="2"/>
      <text x="175" y="46" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">juice</text>
      <text x="175" y="64" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="11.5" text-anchor="middle">fibre removed</text>

      <rect x="132" y="92" width="86" height="34" rx="8" fill="#eaf3f7" stroke="#3a6ea5" stroke-width="2"/>
      <text x="175" y="114" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="12.5" text-anchor="middle">+ carrier</text>
      <polygon points="230,40 254,48 230,56" fill="#7a8a86"/>

      <rect x="266" y="16" width="96" height="60" rx="8" fill="#eef4f0" stroke="#2f6f63" stroke-width="2"/>
      <text x="314" y="46" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">spray dry</text>
      <text x="314" y="112" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">carrier raises Tg</text>
      <polygon points="374,40 398,48 374,56" fill="#7a8a86"/>

      <rect x="410" y="16" width="160" height="60" rx="8" fill="#fdf3e3" stroke="#c79a56" stroke-width="2"/>
      <text x="490" y="52" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">juice powder</text>
    </g>

    <rect x="30" y="228" width="580" height="62" rx="8" fill="#f4efe6" stroke="#c8bda8" stroke-width="2"/>
    <text x="48" y="254" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="12.5" letter-spacing="2">INGREDIENT STATEMENT</text>
    <text x="48" y="280" fill="#172f2b" font-family="'Source Serif 4', Georgia, serif" font-size="18">Strawberry juice powder (maltodextrin, strawberry juice concentrate).</text>
  </g>

  <!-- Composition bars -->
  <g transform="translate(112,634)">
    <rect x="0" y="0" width="1328" height="122" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="34" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="800">WHAT YOU ARE PAYING FOR PER KILOGRAM</text>

    <text x="24" y="70" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="700">fruit powder</text>
    <rect x="170" y="54" width="560" height="22" rx="5" fill="#c05a52"/>
    <text x="450" y="70" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">fruit solids</text>

    <text x="24" y="104" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="700">juice powder</text>
    <rect x="170" y="88" width="240" height="22" rx="5" fill="#c05a52"/>
    <text x="290" y="104" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">juice solids</text>
    <rect x="414" y="88" width="316" height="22" rx="5" fill="#c79a56"/>
    <text x="572" y="104" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">carrier</text>

    <text x="760" y="70" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">Illustrative only — published carrier levels span roughly 7&#8211;20% in many</text>
    <text x="760" y="94" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">spray-dried juices, and 40&#8211;50% in some commercial juice powders.</text>
  </g>

  <text x="112" y="806" fill="#8a948f" font-family="'Source Sans 3', Arial, sans-serif" font-size="16">Freeze-Dried-Fruit.com — ingredient order gives rank, not proportion. Ask for the fruit-solids percentage.</text>
</svg>
