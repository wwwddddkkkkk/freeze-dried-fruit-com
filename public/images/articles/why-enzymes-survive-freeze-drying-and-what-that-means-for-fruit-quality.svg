<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why enzymes survive freeze-drying and what that means for fruit quality</title>
  <desc id="desc">A process timeline from cutting through freezing, sublimation, dry storage and rehydration, with a curve showing enzyme reaction rate falling as water activity falls and rising again when moisture returns, plus a panel on why dry heat does not inactivate.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">TECHNOLOGY</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">The Enzymes Are Still In There</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">Freeze-drying removes the water an enzyme needs. It does not remove the enzyme.</text>

  <!-- Main timeline panel -->
  <g transform="translate(112,296)">
    <rect x="0" y="0" width="960" height="464" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>

    <text x="28" y="40" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">ENZYME REACTION RATE ACROSS THE PROCESS</text>

    <!-- axes -->
    <line x1="90" y1="72" x2="90" y2="330" stroke="#7a8a86" stroke-width="2"/>
    <line x1="90" y1="330" x2="920" y2="330" stroke="#7a8a86" stroke-width="2"/>
    <text x="58" y="200" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 58 200)">reaction rate</text>

    <!-- stable band -->
    <rect x="470" y="72" width="230" height="258" fill="#eef4f0"/>
    <text x="585" y="96" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">stable band — water activity 0.2&#8211;0.3</text>

    <!-- rate curve -->
    <path d="M100,110 L200,104 C260,120 300,190 360,250 C410,296 440,316 470,322 L700,322 C740,300 790,208 860,120 L910,96"
          fill="none" stroke="#d9534f" stroke-width="5"/>

    <!-- stage markers -->
    <g stroke="#c8bda8" stroke-width="1.5" stroke-dasharray="5 5">
      <line x1="200" y1="72" x2="200" y2="330"/>
      <line x1="330" y1="72" x2="330" y2="330"/>
      <line x1="470" y1="72" x2="470" y2="330"/>
      <line x1="700" y1="72" x2="700" y2="330"/>
    </g>

    <g font-family="'Source Sans 3', Arial, sans-serif" font-size="14" fill="#172f2b" font-weight="700" text-anchor="middle">
      <text x="148" y="356">cut / hold</text>
      <text x="265" y="356">freezing</text>
      <text x="400" y="356">sublimation</text>
      <text x="585" y="356">dry storage</text>
      <text x="810" y="356">rehydration</text>
    </g>
    <g font-family="'Source Sans 3', Arial, sans-serif" font-size="12.5" fill="#5f716d" text-anchor="middle">
      <text x="148" y="378">full water, full oxygen</text>
      <text x="265" y="378">freeze-concentration</text>
      <text x="400" y="378">water leaves as vapour</text>
      <text x="585" y="378">no mobile phase</text>
      <text x="810" y="378">mobility returns</text>
    </g>

    <!-- risk callouts -->
    <g>
      <circle cx="148" cy="108" r="9" fill="#d9534f"/>
      <text x="168" y="113" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700">the wet window</text>
      <circle cx="860" cy="120" r="9" fill="#d9534f"/>
      <text x="852" y="150" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end">browning in application</text>
    </g>

    <!-- moisture pickup arrow -->
    <g transform="translate(600,262)">
      <path d="M0,0 C40,-6 80,-26 116,-58" fill="none" stroke="#8a5a1f" stroke-width="3" stroke-dasharray="7 5"/>
      <polygon points="110,-64 128,-66 118,-50" fill="#8a5a1f"/>
      <text x="-6" y="20" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="13">moisture pickup moves you back up the curve</text>
    </g>

    <line x1="28" y1="404" x2="932" y2="404" stroke="#e4dbca" stroke-width="2"/>
    <text x="28" y="436" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="700">Damage clusters before the freezer and after the seal — not inside the cycle.</text>
  </g>

  <!-- Right panel -->
  <g transform="translate(1104,296)">
    <rect x="0" y="0" width="336" height="220" rx="12" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="40" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="800">WHY DRY HEAT FAILS</text>
    <text x="24" y="72" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">Denaturation needs water too.</text>
    <g>
      <rect x="24" y="94" width="130" height="30" rx="6" fill="#eaf3f7" stroke="#3a6ea5" stroke-width="2"/>
      <text x="89" y="114" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">wet: easy to kill</text>
      <rect x="182" y="94" width="130" height="30" rx="6" fill="#fbeceb" stroke="#d9534f" stroke-width="2"/>
      <text x="247" y="114" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">dry: heat resistant</text>
    </g>
    <text x="24" y="158" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">Heating dried fruit enough to</text>
    <text x="24" y="180" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">denature PPO browns the sugars</text>
    <text x="24" y="202" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">and strips aroma first.</text>

    <rect x="0" y="244" width="336" height="220" rx="12" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="284" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="800">WHERE TO INTERVENE</text>
    <g font-family="'Source Sans 3', Arial, sans-serif" font-size="14" fill="#172f2b">
      <circle cx="34" cy="312" r="5" fill="#2f6f63"/><text x="52" y="317">shorten cut-to-freezer time</text>
      <circle cx="34" cy="344" r="5" fill="#2f6f63"/><text x="52" y="349">chill incoming fruit</text>
      <circle cx="34" cy="376" r="5" fill="#2f6f63"/><text x="52" y="381">acid or ascorbate dip</text>
      <circle cx="34" cy="408" r="5" fill="#2f6f63"/><text x="52" y="413">faster freezing</text>
      <circle cx="34" cy="440" r="5" fill="#8a948f"/><text x="52" y="445" fill="#5f716d">blanching — costs texture</text>
    </g>
  </g>

  <text x="112" y="800" fill="#8a948f" font-family="'Source Sans 3', Arial, sans-serif" font-size="16">Freeze-Dried-Fruit.com — colour stability in the pack is a moisture question, not a biology question.</text>
</svg>
