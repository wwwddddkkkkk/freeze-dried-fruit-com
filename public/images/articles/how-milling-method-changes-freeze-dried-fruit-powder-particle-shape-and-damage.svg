<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How milling method changes freeze-dried fruit powder particle shape and damage</title>
  <desc id="desc">Three milling routes — impact, cutting, and screen-limited — shown with the particle shapes each produces, alongside particle-size distribution curves comparing a long fines tail against a narrower spread.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">TECHNOLOGY</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">The Mill Decides the Powder</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">Mesh sets the top size. Shape and fines are set by how the fruit was broken.</text>

  <!-- Feed -->
  <g transform="translate(112,300)">
    <text x="0" y="-14" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="800">FEED</text>
    <rect x="0" y="0" width="200" height="440" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <g>
      <rect x="34" y="60" width="60" height="46" rx="8" fill="#f5e2c8" stroke="#c79a56" stroke-width="2"/>
      <rect x="110" y="110" width="56" height="52" rx="8" fill="#f2d6b3" stroke="#c79a56" stroke-width="2"/>
      <rect x="42" y="170" width="70" height="44" rx="8" fill="#f5e2c8" stroke="#c79a56" stroke-width="2"/>
      <rect x="112" y="222" width="52" height="48" rx="8" fill="#f2d6b3" stroke="#c79a56" stroke-width="2"/>
      <rect x="36" y="278" width="62" height="50" rx="8" fill="#f5e2c8" stroke="#c79a56" stroke-width="2"/>
    </g>
    <text x="100" y="374" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" text-anchor="middle">porous, brittle pieces</text>
    <text x="100" y="400" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">fracture at low energy</text>
    <text x="100" y="424" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">sugar-rich, heat sensitive</text>
  </g>
  <line x1="322" y1="520" x2="376" y2="520" stroke="#7a8a86" stroke-width="5"/>
  <polygon points="376,512 398,520 376,528" fill="#7a8a86"/>

  <!-- Three routes -->
  <g transform="translate(412,300)">
    <text x="0" y="-14" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="800">THREE WAYS TO REDUCE SIZE</text>

    <!-- impact -->
    <rect x="0" y="0" width="480" height="132" rx="12" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="20" y="34" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">Impact</text>
    <text x="20" y="58" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">repeated collision — keeps hitting fine particles</text>
    <circle cx="60" cy="96" r="18" fill="#eaf3f7" stroke="#3a6ea5" stroke-width="2"/>
    <line x1="60" y1="96" x2="96" y2="80" stroke="#3a6ea5" stroke-width="3"/>
    <line x1="60" y1="96" x2="96" y2="112" stroke="#3a6ea5" stroke-width="3"/>
    <g fill="#c79a56">
      <circle cx="180" cy="86" r="9"/><circle cx="212" cy="104" r="6"/><circle cx="244" cy="82" r="7"/>
      <circle cx="272" cy="104" r="4"/><circle cx="300" cy="88" r="3"/><circle cx="326" cy="100" r="3"/>
      <circle cx="350" cy="86" r="2"/><circle cx="372" cy="99" r="2"/><circle cx="394" cy="90" r="2"/>
      <circle cx="414" cy="100" r="1.6"/><circle cx="434" cy="88" r="1.6"/><circle cx="452" cy="98" r="1.4"/>
    </g>
    <text x="330" y="126" fill="#d9534f" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">long fines tail</text>

    <!-- cutting -->
    <rect x="0" y="152" width="480" height="132" rx="12" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="20" y="186" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">Cutting / shear</text>
    <text x="20" y="210" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">blades against a screen — blockier fragments</text>
    <g transform="translate(46,232)">
      <line x1="0" y1="16" x2="40" y2="16" stroke="#3a6ea5" stroke-width="4"/>
      <polygon points="40,8 58,16 40,24" fill="#3a6ea5"/>
    </g>
    <g fill="#f2d6b3" stroke="#c79a56" stroke-width="2">
      <rect x="170" y="236" width="22" height="20" rx="3"/>
      <rect x="208" y="240" width="20" height="18" rx="3"/>
      <rect x="244" y="234" width="24" height="22" rx="3"/>
      <rect x="284" y="240" width="19" height="17" rx="3"/>
      <rect x="318" y="236" width="21" height="20" rx="3"/>
      <rect x="356" y="241" width="18" height="16" rx="3"/>
    </g>
    <text x="330" y="278" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">narrower spread</text>

    <!-- screen-limited -->
    <rect x="0" y="304" width="480" height="136" rx="12" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="20" y="338" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">Screen-limited</text>
    <text x="20" y="362" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">aperture sets top size and residence time</text>
    <g stroke="#7a8a86" stroke-width="3">
      <line x1="150" y1="386" x2="150" y2="424"/><line x1="176" y1="386" x2="176" y2="424"/>
      <line x1="202" y1="386" x2="202" y2="424"/><line x1="228" y1="386" x2="228" y2="424"/>
      <line x1="254" y1="386" x2="254" y2="424"/><line x1="280" y1="386" x2="280" y2="424"/>
    </g>
    <text x="215" y="382" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" text-anchor="middle">screen aperture</text>
    <g fill="#c79a56">
      <circle cx="330" cy="400" r="7"/><circle cx="358" cy="412" r="5"/><circle cx="384" cy="398" r="6"/><circle cx="410" cy="410" r="4"/>
    </g>
    <text x="380" y="434" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">shorter time in chamber</text>
  </g>

  <!-- Distribution panel -->
  <g transform="translate(952,300)">
    <text x="0" y="-14" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="800">SAME MESH, DIFFERENT POWDER</text>
    <rect x="0" y="0" width="488" height="440" rx="12" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <line x1="70" y1="46" x2="70" y2="330" stroke="#7a8a86" stroke-width="2"/>
    <line x1="70" y1="330" x2="440" y2="330" stroke="#7a8a86" stroke-width="2"/>
    <text x="36" y="188" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 36 188)">share of material</text>
    <text x="255" y="360" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">particle size →</text>

    <path d="M78,326 C120,150 150,110 190,150 C240,200 300,300 420,326" fill="none" stroke="#d9534f" stroke-width="5"/>
    <path d="M78,328 C180,326 230,120 280,110 C330,102 370,290 420,328" fill="none" stroke="#2f6f63" stroke-width="5"/>

    <text x="150" y="98" fill="#d9534f" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="700">impact-milled</text>
    <text x="332" y="92" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="700">cut / sieved fraction</text>

    <line x1="400" y1="46" x2="400" y2="330" stroke="#8a948f" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="400" y="40" fill="#8a948f" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">mesh cut-off</text>

    <text x="24" y="382" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="700">Both pass the same mesh spec.</text>
    <text x="24" y="408" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14">Flow, dosing, dust, and dispersion differ.</text>
  </g>

  <text x="112" y="792" fill="#8a948f" font-family="'Source Sans 3', Arial, sans-serif" font-size="16">Freeze-Dried-Fruit.com — ask for mill type, screen size, and a distribution, not one mesh line.</text>
</svg>
