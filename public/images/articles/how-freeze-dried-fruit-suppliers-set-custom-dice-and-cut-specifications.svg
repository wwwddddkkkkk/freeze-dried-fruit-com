<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Specifying freeze-dried fruit cuts</title>
  <desc id="desc">Six formats from whole fruit to powder, followed by a screen separating on-size pieces from off-size fines. A useful specification defines the target, range, and fines limit.</desc>
  <defs>
    <pattern id="screen" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#859e91" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="112" y="138" fill="#24433d" font-size="25" letter-spacing="5">INDUSTRY INSIGHTS</text>
    <text x="112" y="207" fill="#172f2b" font-family="Georgia, serif" font-size="51">Define the cut. Then define the tolerance.</text>
    <text x="112" y="251" fill="#5f716d" font-size="24">A single size number does not describe the whole bag.</text>
    <g fill="#eff2e9" stroke="#d4ddcf" stroke-width="2">
      <rect x="112" y="302" width="208" height="236" rx="20"/>
      <rect x="344" y="302" width="208" height="236" rx="20"/>
      <rect x="576" y="302" width="208" height="236" rx="20"/>
      <rect x="808" y="302" width="208" height="236" rx="20"/>
      <rect x="1040" y="302" width="208" height="236" rx="20"/>
      <rect x="1272" y="302" width="208" height="236" rx="20"/>
    </g>
    <path d="M167 365Q216 330 265 365Q273 412 216 456Q159 412 167 365Z" fill="#cd7663" stroke="#aa5c4c" stroke-width="3"/>
    <path d="M195 355l21-24 21 24" fill="#6a9277"/>
    <g fill="#f1cfaa" stroke="#c28064" stroke-width="5"><ellipse cx="448" cy="382" rx="63" ry="24"/><ellipse cx="448" cy="414" rx="63" ry="24"/></g>
    <g fill="#d5896f" stroke="#ab604e" stroke-width="3"><rect x="617" y="359" width="53" height="53" rx="5"/><rect x="683" y="359" width="53" height="53" rx="5"/><rect x="649" y="425" width="53" height="53" rx="5"/></g>
    <g fill="#d5896f" stroke="#ab604e" stroke-width="2"><rect x="847" y="365" width="29" height="29" rx="3"/><rect x="892" y="355" width="29" height="29" rx="3"/><rect x="940" y="370" width="29" height="29" rx="3"/><rect x="867" y="415" width="29" height="29" rx="3"/><rect x="914" y="416" width="29" height="29" rx="3"/><rect x="946" y="455" width="22" height="22" rx="3"/></g>
    <g fill="#d5896f"><path d="M1081 370l21-10 13 21-22 12Zm46 18 25-12 8 21-18 12Zm50-23 19 10-8 19-23-11Zm-92 67 21-14 16 18-25 11Zm50 12 19-19 16 22-23 9Zm42-29 23 10-9 24-22-14Z"/></g>
    <path d="M1310 449q66-112 132 0Z" fill="#d5a087"/>
    <g fill="#b57760"><circle cx="1333" cy="462" r="4"/><circle cx="1352" cy="468" r="3"/><circle cx="1375" cy="458" r="4"/><circle cx="1401" cy="464" r="3"/><circle cx="1424" cy="462" r="4"/></g>
    <g fill="#24433d" font-size="25" text-anchor="middle"><text x="216" y="509">Whole</text><text x="448" y="509">Slices</text><text x="680" y="509">Large dice</text><text x="912" y="509">Small dice</text><text x="1144" y="509">Fines</text><text x="1376" y="509">Powder</text></g>
    <rect x="112" y="574" width="658" height="204" rx="22" fill="#e6eee4"/>
    <text x="146" y="619" fill="#24433d" font-size="26" font-weight="700">Screen the finished lot</text>
    <rect x="148" y="642" width="302" height="55" rx="5" fill="url(#screen)" stroke="#6a8c79" stroke-width="3"/>
    <path d="M487 665h45m-12-10 12 10-12 10" fill="none" stroke="#24433d" stroke-width="3"/>
    <text x="558" y="674" fill="#24433d" font-size="23">On-size pieces</text>
    <path d="M293 706v37m-10-12 10 12 10-12" fill="none" stroke="#b57760" stroke-width="3"/>
    <text x="326" y="748" fill="#7f5946" font-size="22">Undersize + fines</text>
    <rect x="802" y="574" width="678" height="204" rx="22" fill="#17312f"/>
    <text x="840" y="621" fill="#fcfaf5" font-size="26" font-weight="700">A useful cut specification names</text>
    <g fill="#d6e7d8" font-size="25"><text x="840" y="666">01  Target shape and dimension</text><text x="840" y="708">02  Acceptable size range</text><text x="840" y="750">03  Limits for off-size pieces and fines</text></g>
  </g>
</svg>
