<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Using freeze-dried fruit in cake pops, truffles, and dessert bites</title>
  <desc id="desc">A four-step path: mix freeze-dried fruit powder into the center, roll into balls, chill, then dip in chocolate and press crushed pieces onto the outside, with a note that powder goes inside and pieces go outside.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">APPLICATIONS</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">Powder Inside, Pieces Outside</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">Flavor and color for a bite that holds its shape and takes a clean coating.</text>

  <!-- 4 steps -->
  <g font-family="'Source Sans 3', Arial, sans-serif">
    <!-- step 1 -->
    <g transform="translate(150,340)">
      <circle cx="95" cy="95" r="95" fill="#ffffff" stroke="#2f6f63" stroke-width="4"/>
      <text x="95" y="66" fill="#2f6f63" font-size="20" font-weight="800" text-anchor="middle">1 · MIX</text>
      <circle cx="95" cy="110" r="42" fill="#f2d6b3" stroke="#c79a56" stroke-width="2"/>
      <circle cx="80" cy="100" r="3" fill="#d9534f"/><circle cx="105" cy="118" r="3" fill="#d9534f"/><circle cx="92" cy="126" r="3" fill="#d9534f"/>
      <text x="95" y="176" fill="#172f2b" font-size="15" text-anchor="middle">powder into center</text>
    </g>
    <!-- step 2 -->
    <g transform="translate(490,340)">
      <circle cx="95" cy="95" r="95" fill="#ffffff" stroke="#2f6f63" stroke-width="4"/>
      <text x="95" y="66" fill="#2f6f63" font-size="20" font-weight="800" text-anchor="middle">2 · ROLL</text>
      <circle cx="70" cy="120" r="24" fill="#e7a06a"/>
      <circle cx="118" cy="110" r="24" fill="#e7a06a"/>
      <circle cx="95" cy="140" r="24" fill="#e7a06a"/>
      <text x="95" y="176" fill="#172f2b" font-size="15" text-anchor="middle">shape into balls</text>
    </g>
    <!-- step 3 -->
    <g transform="translate(830,340)">
      <circle cx="95" cy="95" r="95" fill="#ffffff" stroke="#2f6f63" stroke-width="4"/>
      <text x="95" y="66" fill="#2f6f63" font-size="20" font-weight="800" text-anchor="middle">3 · CHILL</text>
      <circle cx="95" cy="115" r="40" fill="#e7a06a"/>
      <path d="M95,70 v90 M60,115 h70 M70,90 l50,50 M120,90 l-50,50" stroke="#8ac6b3" stroke-width="3"/>
      <text x="95" y="176" fill="#172f2b" font-size="15" text-anchor="middle">firm up cold</text>
    </g>
    <!-- step 4 -->
    <g transform="translate(1170,340)">
      <circle cx="95" cy="95" r="95" fill="#ffffff" stroke="#2f6f63" stroke-width="4"/>
      <text x="95" y="60" fill="#2f6f63" font-size="20" font-weight="800" text-anchor="middle">4 · DIP</text>
      <circle cx="95" cy="112" r="44" fill="#5b3a24"/>
      <circle cx="95" cy="112" r="28" fill="#e7a06a"/>
      <circle cx="70" cy="90" r="4" fill="#d9534f"/><circle cx="120" cy="98" r="4" fill="#d9534f"/><circle cx="108" cy="140" r="4" fill="#d9534f"/><circle cx="75" cy="132" r="4" fill="#d9534f"/>
      <text x="95" y="180" fill="#172f2b" font-size="15" text-anchor="middle">coat + press pieces</text>
    </g>
    <!-- arrows -->
    <g stroke="#c79a56" stroke-width="4" fill="#c79a56">
      <line x1="345" y1="435" x2="485" y2="435"/><polygon points="485,429 505,435 485,441"/>
      <line x1="685" y1="435" x2="825" y2="435"/><polygon points="825,429 845,435 825,441"/>
      <line x1="1025" y1="435" x2="1165" y2="435"/><polygon points="1165,429 1185,435 1165,441"/>
    </g>
  </g>

  <!-- bottom note bar -->
  <g transform="translate(150,620)">
    <rect x="0" y="0" width="1300" height="130" rx="14" fill="#eef4ef" stroke="#cde0d6" stroke-width="2"/>
    <text x="30" y="48" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="800">Keep it dry before dipping</text>
    <text x="30" y="82" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="17">Water seizes chocolate — freeze-dried fruit adds flavor with almost none. Powder flavors the center;</text>
    <text x="30" y="110" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="17">crushed pieces go on the wet coating so their crunch survives. Add powder in stages so the mix stays rollable.</text>
  </g>

  <text x="112" y="792" fill="#8a948f" font-family="'Source Sans 3', Arial, sans-serif" font-size="16">Freeze-Dried-Fruit.com — tart fruits like raspberry and passion fruit cut through rich centers.</text>
</svg>
