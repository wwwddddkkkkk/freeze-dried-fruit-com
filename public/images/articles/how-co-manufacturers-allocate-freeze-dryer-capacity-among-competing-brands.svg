<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How a co-manufacturer allocates shared freeze-dryer chambers among brands</title>
  <desc id="desc">A weekly schedule across shared freeze-dryer chambers. Committed-volume brands are slotted first, similar products are batched to cut changeover, and spot orders fill the remaining gaps.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">INDUSTRY INSIGHTS</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">Whose Lot Runs This Week</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">Shared chambers, one queue: commitment sets priority, spot orders take the gaps.</text>

  <!-- chamber schedule grid -->
  <g transform="translate(150,300)">
    <text x="0" y="-6" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Mon</text>
    <text x="230" y="-6" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Wed</text>
    <text x="470" y="-6" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Fri</text>
    <text x="700" y="-6" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Sun</text>

    <!-- Chamber A -->
    <text x="-96" y="52" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="700">Chamber A</text>
    <rect x="0" y="20" width="360" height="52" rx="8" fill="#2f6f63" opacity="0.85"/>
    <text x="16" y="53" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="700">Committed — Brand 1 (take-or-pay)</text>
    <rect x="372" y="20" width="200" height="52" rx="8" fill="#2f6f63" opacity="0.55"/>
    <text x="388" y="53" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="700">Committed — Brand 2</text>
    <rect x="584" y="20" width="176" height="52" rx="8" fill="#c9c2b4"/>
    <text x="600" y="53" fill="#5f4a34" font-family="'Source Sans 3', Arial, sans-serif" font-size="17">Spot — open</text>

    <!-- Chamber B -->
    <text x="-96" y="132" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="700">Chamber B</text>
    <rect x="0" y="100" width="300" height="52" rx="8" fill="#2f6f63" opacity="0.7"/>
    <text x="16" y="133" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="700">Berry campaign (batched)</text>
    <rect x="312" y="100" width="240" height="52" rx="8" fill="#2f6f63" opacity="0.7"/>
    <text x="328" y="133" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="700">Berry campaign</text>
    <rect x="564" y="100" width="60" height="52" rx="8" fill="#b8452e" opacity="0.8"/>
    <text x="574" y="133" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="700">CIP</text>
    <rect x="636" y="100" width="124" height="52" rx="8" fill="#c9c2b4"/>
    <text x="652" y="133" fill="#5f4a34" font-family="'Source Sans 3', Arial, sans-serif" font-size="17">Spot</text>

    <!-- Chamber C -->
    <text x="-96" y="212" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="700">Chamber C</text>
    <rect x="0" y="180" width="220" height="52" rx="8" fill="#2f6f63" opacity="0.85"/>
    <text x="16" y="213" fill="#ffffff" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="700">Committed — Brand 1</text>
    <rect x="232" y="180" width="120" height="52" rx="8" fill="#c9c2b4"/>
    <text x="248" y="213" fill="#5f4a34" font-family="'Source Sans 3', Arial, sans-serif" font-size="17">Spot</text>
    <rect x="364" y="180" width="396" height="52" rx="8" fill="#e4c07a" opacity="0.7"/>
    <text x="380" y="213" fill="#6b4a1c" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="700">Peak-season crunch — no open slots</text>
  </g>

  <!-- legend -->
  <g transform="translate(150,600)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#2f6f63"/>
    <text x="32" y="18" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Committed volume — priority</text>
    <rect x="360" y="0" width="22" height="22" rx="4" fill="#c9c2b4"/>
    <text x="392" y="18" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Spot — fills gaps</text>
    <rect x="640" y="0" width="22" height="22" rx="4" fill="#b8452e" opacity="0.8"/>
    <text x="672" y="18" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Changeover / cleaning downtime</text>
  </g>
  <text x="150" y="795" fill="#8a5a3b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Illustrative schedule. A forecast is not a reservation — only a commitment holds a slot when chambers fill.</text>
</svg>
