<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What single origin tells a fruit buyer</title>
  <desc id="desc">Nested country, region, farm, and variety levels show that single origin can describe very different scopes. The buyer should ask for a named source and traceability records; the claim alone does not guarantee quality or certification.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="112" y="138" fill="#24433d" font-size="25" letter-spacing="5">LABELS &amp; QUALITY</text>
    <text x="112" y="207" fill="#172f2b" font-family="Georgia, serif" font-size="51">Single origin: ask how specific the source is.</text>
    <text x="112" y="251" fill="#5f716d" font-size="24">The phrase can describe a country, a region, a farm, or a variety.</text>
    <rect x="112" y="300" width="666" height="482" rx="24" fill="#e6eee4" stroke="#c4d4bf" stroke-width="2"/>
    <rect x="160" y="385" width="570" height="349" rx="22" fill="#d4e2cf" stroke="#94ad89" stroke-width="2"/>
    <rect x="210" y="472" width="470" height="224" rx="20" fill="#bdcfb8" stroke="#7e9e73" stroke-width="2"/>
    <rect x="260" y="558" width="370" height="101" rx="18" fill="#42664d"/>
    <g fill="#24433d" font-size="30" font-weight="700"><text x="150" y="352">Country</text><text x="196" y="435">Region</text><text x="246" y="520">Farm</text></g>
    <text x="300" y="621" fill="#fcfaf5" font-size="30" font-weight="700">Variety / cultivar</text>
    <rect x="814" y="300" width="666" height="245" rx="24" fill="#17312f"/>
    <text x="854" y="351" fill="#fcfaf5" font-size="29" font-weight="700">Ask for evidence</text>
    <g fill="#dce9df" font-size="25"><text x="854" y="402">A named, written origin</text><text x="854" y="448">Lot-level traceability records</text><text x="854" y="494">The fruit specification and test results</text></g>
    <rect x="814" y="573" width="666" height="209" rx="24" fill="#f1e9da" stroke="#ddcfb6" stroke-width="2"/>
    <text x="854" y="622" fill="#70583a" font-size="28" font-weight="700">The claim alone does not guarantee</text>
    <g fill="#70583a" font-size="25"><text x="854" y="668">Higher quality or better processing</text><text x="854" y="712">Organic or other certification</text><text x="854" y="756">One standard definition of “origin”</text></g>
  </g>
</svg>
