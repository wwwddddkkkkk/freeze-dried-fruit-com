name: Auto-update News Wire

# Pulls fresh items from the configured RSS sources every six hours and commits
# content changes back to main. The follow-up push triggers Cloudflare Workers
# Builds. Failed polls keep the previous feed and fail the run; unchanged polls
# keep the timestamp and do not trigger an unnecessary deployment.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Check RSS failure handling
        run: node --test scripts/fetch-news.test.mjs

      - name: Fetch RSS sources
        run: npm run fetch-news

      - name: Commit updated feed.json
        run: |
          git config user.name "freezedriedfruit-bot"
          git config user.email "bot@freeze-dried-fruit.com"
          if git diff --quiet -- content/news/feed.json; then
            echo "No news changes — skipping commit."
            exit 0
          fi
          git add content/news/feed.json
          git commit -m "chore(news): refresh wire feed"
          git push
