<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reading Total Sugars vs Added Sugars on a freeze-dried fruit label</title>
  <desc id="desc">Two Nutrition Facts sugar sections. Left: plain freeze-dried strawberries with high Total Sugars and zero Added Sugars. Right: a sweetened fruit crisp with Added Sugars above zero and a percent Daily Value.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">LABELS &amp; QUALITY</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">Same Sugar Number, Two Different Stories</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">The Added Sugars line — not Total Sugars — tells you if the bag was sweetened.</text>

  <!-- Left panel: plain -->
  <g transform="translate(150,300)">
    <rect x="0" y="0" width="600" height="440" rx="12" fill="#ffffff" stroke="#172f2b" stroke-width="3"/>
    <text x="24" y="46" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="800">Plain freeze-dried strawberries</text>
    <line x1="24" y1="66" x2="576" y2="66" stroke="#172f2b" stroke-width="2"/>
    <text x="24" y="118" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700">Total Sugars 9g</text>
    <line x1="24" y1="140" x2="576" y2="140" stroke="#c9c2b4" stroke-width="1.5"/>
    <text x="70" y="188" fill="#17312f" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="800">Includes 0g Added Sugars</text>
    <rect x="60" y="205" width="360" height="34" rx="8" fill="#2f6f63" opacity="0.12"/>
    <text x="70" y="230" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="700">0% Daily Value</text>
    <line x1="24" y1="266" x2="576" y2="266" stroke="#172f2b" stroke-width="2"/>
    <text x="24" y="308" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="700">INGREDIENTS</text>
    <text x="24" y="340" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="21">Strawberries.</text>
    <text x="24" y="404" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" font-weight="700">→ Sweetness is the fruit's own</text>
  </g>

  <!-- Right panel: sweetened -->
  <g transform="translate(850,300)">
    <rect x="0" y="0" width="600" height="440" rx="12" fill="#ffffff" stroke="#172f2b" stroke-width="3"/>
    <text x="24" y="46" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="800">Sweetened fruit crisps</text>
    <line x1="24" y1="66" x2="576" y2="66" stroke="#172f2b" stroke-width="2"/>
    <text x="24" y="118" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700">Total Sugars 15g</text>
    <line x1="24" y1="140" x2="576" y2="140" stroke="#c9c2b4" stroke-width="1.5"/>
    <text x="70" y="188" fill="#7a4426" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="800">Includes 7g Added Sugars</text>
    <rect x="60" y="205" width="360" height="34" rx="8" fill="#c1663b" opacity="0.15"/>
    <text x="70" y="230" fill="#c1663b" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="700">14% Daily Value</text>
    <line x1="24" y1="266" x2="576" y2="266" stroke="#172f2b" stroke-width="2"/>
    <text x="24" y="308" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="700">INGREDIENTS</text>
    <text x="24" y="340" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="21">Apples, cane sugar, ascorbic acid.</text>
    <text x="24" y="404" fill="#c1663b" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" font-weight="700">→ Sweetness was added</text>
  </g>
  <text x="150" y="795" fill="#8a5a3b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Figures are illustrative. Total Sugars = amount you eat · Added Sugars = what the maker put in · confirm with the ingredient list.</text>
</svg>
