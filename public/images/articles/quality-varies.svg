<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why freeze-dried fruit quality varies</title>
  <desc id="desc">Editorial systems diagram connecting raw material, freeze-drying cycle, moisture control, and packaging to color, aroma, crunch, and breakage outcomes.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0a2540" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#0a2540" fill-opacity=".2"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a2540" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f4f1e9"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="88" y="92" fill="#0a2540" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" letter-spacing="5">FIG. 01 / QUALITY SYSTEM</text>
  <text x="88" y="164" fill="#0a2540" font-family="'DM Serif Display', Georgia, serif" font-size="62">Why quality varies</text>
  <text x="1512" y="92" text-anchor="end" fill="#3aa982" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="4">FIELD GUIDE</text>
  <line x1="88" y1="198" x2="1512" y2="198" stroke="#0a2540" stroke-width="2"/>

  <!-- Four inputs -->
  <g filter="url(#softShadow)">
    <rect x="88" y="250" width="300" height="342" rx="12" fill="#fffdf8" stroke="#0a2540" stroke-width="2"/>
    <rect x="412" y="250" width="300" height="342" rx="12" fill="#eef7f3" stroke="#0a2540" stroke-width="2"/>
    <rect x="736" y="250" width="300" height="342" rx="12" fill="#fffdf8" stroke="#0a2540" stroke-width="2"/>
    <rect x="1060" y="250" width="300" height="342" rx="12" fill="#eef7f3" stroke="#0a2540" stroke-width="2"/>
  </g>

  <!-- Raw material -->
  <text x="120" y="298" fill="#3aa982" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="3">01 / RAW MATERIAL</text>
  <g transform="translate(238 428) scale(.82)">
    <path d="M0-84C76-84 114-35 96 35C80 98 31 130 0 130S-80 98-96 35C-114-35-76-84 0-84Z" fill="#b95f72" fill-opacity=".86" stroke="#0a2540" stroke-width="4"/>
    <path d="M-8-84C-13-120 15-138 44-142C37-112 21-94-8-84Z" fill="#3ccfa1" stroke="#0a2540" stroke-width="4"/>
    <path d="M-56-7C-30 16-14 41-7 76M48-20C27 8 16 39 13 82" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>
  <text x="238" y="548" text-anchor="middle" fill="#0a2540" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" letter-spacing="1.4">VARIETY · RIPENESS · CUT</text>

  <!-- Cycle design -->
  <text x="444" y="298" fill="#3aa982" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="3">02 / CYCLE DESIGN</text>
  <g transform="translate(562 415)" fill="none" stroke="#0a2540" stroke-width="4">
    <rect x="-94" y="-92" width="188" height="184" rx="8" fill="#fffdf8"/>
    <line x1="-65" y1="-49" x2="65" y2="-49"/>
    <line x1="-65" y1="0" x2="65" y2="0"/>
    <line x1="-65" y1="49" x2="65" y2="49"/>
    <path d="M-125 90C-112 42-112-42-125-90" stroke="#3ccfa1" stroke-width="8" stroke-linecap="round"/>
    <path d="M125 90C112 42 112-42 125-90" stroke="#b95f72" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-49" r="9" fill="#b95f72"/>
    <circle cx="0" cy="0" r="9" fill="#3ccfa1"/>
    <circle cx="0" cy="49" r="9" fill="#f2c28a"/>
  </g>
  <text x="562" y="548" text-anchor="middle" fill="#0a2540" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" letter-spacing="1.4">FREEZE · HEAT · VACUUM</text>

  <!-- Moisture control -->
  <text x="768" y="298" fill="#3aa982" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="3">03 / MOISTURE</text>
  <g transform="translate(790 343)">
    <line x1="0" y1="170" x2="198" y2="170" stroke="#0a2540" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="170" stroke="#0a2540" stroke-width="3"/>
    <path d="M0 150C34 148 52 133 76 111S124 86 144 51S177 22 198 18" fill="none" stroke="#b95f72" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 151C46 150 95 147 198 145" fill="none" stroke="#3ccfa1" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="104" x2="198" y2="104" stroke="#0a2540" stroke-opacity=".18" stroke-width="2" stroke-dasharray="8 10"/>
    <text x="212" y="25" fill="#b95f72" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">EXPOSED</text>
    <text x="212" y="151" fill="#3aa982" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">SEALED</text>
  </g>
  <text x="886" y="548" text-anchor="middle" fill="#0a2540" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" letter-spacing="1.2">MOISTURE · WATER ACTIVITY</text>

  <!-- Packaging -->
  <text x="1092" y="298" fill="#3aa982" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" letter-spacing="3">04 / PACKAGING</text>
  <g transform="translate(1210 420)">
    <path d="M-92-97H92L110 96H-110Z" fill="#fffdf8" stroke="#0a2540" stroke-width="4"/>
    <path d="M-92-97H92" stroke="#3ccfa1" stroke-width="14"/>
    <rect x="-66" y="-52" width="132" height="108" rx="8" fill="url(#dots)" stroke="#0a2540" stroke-width="3"/>
    <path d="M-142-42H-113M-151 0H-112M-142 42H-108" stroke="#b95f72" stroke-width="5" stroke-linecap="round"/>
    <path d="M145-42H111M153 0H112M145 42H108" stroke="#3aa982" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="1210" y="548" text-anchor="middle" fill="#0a2540" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" letter-spacing="1.4">BARRIER · SEAL · STORAGE</text>

  <!-- System flow -->
  <path d="M238 620V656H1210V620" fill="none" stroke="#0a2540" stroke-width="3"/>
  <path d="M562 592V656M886 592V656" stroke="#0a2540" stroke-width="3"/>
  <path d="M724 656V702" stroke="#0a2540" stroke-width="3"/>
  <path d="M714 691L724 702L734 691" fill="none" stroke="#0a2540" stroke-width="3"/>

  <!-- Outcomes -->
  <rect x="88" y="716" width="1424" height="118" rx="12" fill="#0a2540"/>
  <text x="124" y="763" fill="#3ccfa1" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="700" letter-spacing="4">THE BAG REVEALS THE SYSTEM</text>
  <g font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#fffdf8">
    <text x="124" y="811">Color</text>
    <text x="432" y="811">Aroma</text>
    <text x="737" y="811">Crunch</text>
    <text x="1067" y="811">Breakage</text>
  </g>
  <g fill="#3ccfa1">
    <circle cx="333" cy="801" r="5"/>
    <circle cx="638" cy="801" r="5"/>
    <circle cx="968" cy="801" r="5"/>
  </g>
</svg>
