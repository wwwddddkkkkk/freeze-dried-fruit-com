<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How to build shelf-stable dry baking mixes with freeze-dried fruit</title>
  <desc id="desc">A cutaway of a layered jar mix with water activity values marked for each layer and arrows showing moisture migrating toward the driest freeze-dried fruit layer, next to a corrected build where the fruit sits in a sealed sachet, plus a ranked list of moisture donors.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">APPLICATIONS</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">The Jar Always Reaches One Number</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">Freeze-dried fruit is the driest thing in the mix, so it collects everyone else&#8217;s moisture.</text>

  <!-- Jar A: loose fruit -->
  <g transform="translate(112,296)">
    <rect x="0" y="0" width="440" height="464" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="40" fill="#d9534f" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">LOOSE FRUIT LAYER</text>

    <!-- jar shape -->
    <g transform="translate(46,58)">
      <rect x="20" y="0" width="150" height="20" rx="5" fill="#e4dbca" stroke="#c8bda8" stroke-width="2"/>
      <rect x="8" y="20" width="174" height="326" rx="14" fill="#fdfbf6" stroke="#c8bda8" stroke-width="3"/>

      <rect x="16" y="42" width="158" height="52" fill="#f5c9c4"/>
      <text x="95" y="74" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">freeze-dried fruit</text>

      <rect x="16" y="94" width="158" height="46" fill="#efe4d0"/>
      <text x="95" y="122" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">oats</text>

      <rect x="16" y="140" width="158" height="52" fill="#d8b78a"/>
      <text x="95" y="171" fill="#5c3d16" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">brown sugar</text>

      <rect x="16" y="192" width="158" height="46" fill="#f6f1e6"/>
      <text x="95" y="220" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">white sugar</text>

      <rect x="16" y="238" width="158" height="100" fill="#f9f4e8"/>
      <text x="95" y="292" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">flour + leavening</text>
    </g>

    <!-- aw labels -->
    <g font-family="'Source Sans 3', Arial, sans-serif" font-size="13" fill="#5f716d">
      <text x="246" y="128">~0.15 &#8212; driest</text>
      <text x="246" y="174">~0.4</text>
      <text x="246" y="228">~0.55 &#8212; wettest</text>
      <text x="246" y="274">~0.35</text>
      <text x="246" y="342">~0.3</text>
    </g>

    <!-- migration arrows -->
    <g stroke="#8a5a1f" stroke-width="3" fill="none">
      <path d="M232,214 C258,190 258,150 236,122"/>
      <path d="M228,268 C266,236 268,152 238,124"/>
    </g>
    <polygon points="230,116 240,132 246,116" fill="#8a5a1f"/>
    <text x="228" y="392" fill="#8a5a1f" font-family="'Source Sans 3', Arial, sans-serif" font-size="13">vapour moves up the gradient</text>

    <rect x="24" y="410" width="392" height="38" rx="8" fill="#fbeceb" stroke="#d9534f" stroke-width="2"/>
    <text x="220" y="435" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">soft, dull fruit in a few weeks</text>
  </g>

  <!-- Jar B: sachet -->
  <g transform="translate(584,296)">
    <rect x="0" y="0" width="440" height="464" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="40" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">FRUIT IN A SEALED SACHET</text>

    <g transform="translate(46,58)">
      <rect x="20" y="0" width="150" height="20" rx="5" fill="#e4dbca" stroke="#c8bda8" stroke-width="2"/>
      <rect x="8" y="20" width="174" height="326" rx="14" fill="#fdfbf6" stroke="#c8bda8" stroke-width="3"/>

      <rect x="16" y="42" width="158" height="52" fill="#f5c9c4" stroke="#2f6f63" stroke-width="3" stroke-dasharray="6 4"/>
      <text x="95" y="66" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="700">fruit sachet</text>
      <text x="95" y="84" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="12" text-anchor="middle">own barrier</text>

      <rect x="16" y="94" width="158" height="46" fill="#efe4d0"/>
      <text x="95" y="122" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">oats</text>

      <rect x="16" y="140" width="158" height="52" fill="#f6f1e6"/>
      <text x="95" y="166" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">white sugar</text>
      <text x="95" y="184" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="11.5" text-anchor="middle">molasses added at bake time</text>

      <rect x="16" y="192" width="158" height="146" fill="#f9f4e8"/>
      <text x="95" y="266" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" text-anchor="middle">flour + leavening</text>
    </g>

    <g transform="translate(240,120)">
      <circle cx="0" cy="0" r="9" fill="#2f6f63"/>
      <text x="18" y="5" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">sealed &#8212; not part of the system</text>
    </g>
    <g transform="translate(240,196)">
      <circle cx="0" cy="0" r="9" fill="#2f6f63"/>
      <text x="18" y="5" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">no brown sugar in the jar</text>
    </g>
    <g transform="translate(240,268)">
      <circle cx="0" cy="0" r="9" fill="#2f6f63"/>
      <text x="18" y="5" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">no fat in the jar</text>
    </g>
    <g transform="translate(240,340)">
      <circle cx="0" cy="0" r="9" fill="#2f6f63"/>
      <text x="18" y="5" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">filled full, minimal headspace</text>
    </g>

    <rect x="24" y="410" width="392" height="38" rx="8" fill="#eef4f0" stroke="#2f6f63" stroke-width="2"/>
    <text x="220" y="435" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">crisp fruit for months</text>
  </g>

  <!-- Donor ranking -->
  <g transform="translate(1056,296)">
    <rect x="0" y="0" width="384" height="464" rx="14" fill="#ffffff" stroke="#d4c7b1" stroke-width="2"/>
    <text x="24" y="40" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="18" font-weight="800">WHO DONATES MOISTURE</text>
    <text x="24" y="66" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">wettest at the top</text>

    <g transform="translate(24,88)">
      <rect x="0" y="0" width="336" height="46" rx="8" fill="#d8b78a"/>
      <text x="16" y="29" fill="#4a3110" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="700">brown sugar</text>
      <rect x="0" y="58" width="290" height="46" rx="8" fill="#e6d4b6"/>
      <text x="16" y="87" fill="#5c3d16" font-family="'Source Sans 3', Arial, sans-serif" font-size="15">oats, wholegrain flour</text>
      <rect x="0" y="116" width="240" height="46" rx="8" fill="#efe4d0"/>
      <text x="16" y="145" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="15">white flour</text>
      <rect x="0" y="174" width="196" height="46" rx="8" fill="#f4ecdc"/>
      <text x="16" y="203" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="15">white sugar</text>
      <rect x="0" y="232" width="148" height="46" rx="8" fill="#f8f3e8"/>
      <text x="16" y="261" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="15">cocoa, milk powder</text>
      <rect x="0" y="290" width="84" height="46" rx="8" fill="#f5c9c4"/>
      <text x="96" y="319" fill="#8a2c28" font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="700">freeze-dried fruit</text>
    </g>
    <text x="24" y="450" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="13.5">Powder absorbs far faster than pieces.</text>
  </g>

  <text x="112" y="806" fill="#8a948f" font-family="'Source Sans 3', Arial, sans-serif" font-size="16">Freeze-Dried-Fruit.com &#8212; separate the fruit, keep it in pieces, leave the brown sugar out.</text>
</svg>
