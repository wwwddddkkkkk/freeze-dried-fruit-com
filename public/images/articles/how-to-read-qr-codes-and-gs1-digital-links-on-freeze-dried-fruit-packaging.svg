<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Marketing QR code versus GS1 Digital Link on freeze-dried fruit packaging</title>
  <desc id="desc">Two scannable codes compared. Left: a plain marketing QR that opens a generic webpage. Right: a GS1 Digital Link that resolves to structured product data including GTIN, lot, and batch.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <text x="112" y="138" fill="#24433d" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" letter-spacing="5">LABELS &amp; QUALITY</text>
  <text x="112" y="196" fill="#172f2b" font-family="'DM Serif Display', Georgia, serif" font-size="46">Two Codes, Two Kinds of Trust</text>
  <text x="112" y="238" fill="#5f716d" font-family="'Source Serif 4', Georgia, serif" font-size="24">A square code can open a webpage — or carry the product's identity, lot, and batch.</text>

  <!-- Left: marketing QR -->
  <g transform="translate(150,300)">
    <rect x="0" y="0" width="600" height="440" rx="12" fill="#ffffff" stroke="#172f2b" stroke-width="3"/>
    <text x="24" y="46" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="800">Marketing QR</text>
    <line x1="24" y1="66" x2="576" y2="66" stroke="#172f2b" stroke-width="2"/>
    <!-- simple qr glyph -->
    <g transform="translate(40,96)" fill="#172f2b">
      <rect x="0" y="0" width="120" height="120" fill="none" stroke="#172f2b" stroke-width="10"/>
      <rect x="24" y="24" width="30" height="30"/>
      <rect x="150" y="0" width="30" height="30"/><rect x="180" y="30" width="30" height="30"/><rect x="150" y="60" width="30" height="30"/>
      <rect x="0" y="150" width="30" height="30"/><rect x="60" y="150" width="30" height="30"/><rect x="30" y="180" width="30" height="30"/>
      <rect x="150" y="150" width="60" height="60" fill="none" stroke="#172f2b" stroke-width="10"/>
    </g>
    <text x="290" y="150" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="700">Opens:</text>
    <text x="290" y="184" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="19">a webpage the brand chose</text>
    <text x="290" y="214" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="19">recipes · brand story · promo</text>
    <line x1="24" y1="330" x2="576" y2="330" stroke="#c9c2b4" stroke-width="1.5"/>
    <text x="24" y="378" fill="#c1663b" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" font-weight="700">→ Content is marketing, not verified</text>
  </g>

  <!-- Right: GS1 Digital Link -->
  <g transform="translate(850,300)">
    <rect x="0" y="0" width="600" height="440" rx="12" fill="#ffffff" stroke="#172f2b" stroke-width="3"/>
    <text x="24" y="46" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="800">GS1 Digital Link</text>
    <line x1="24" y1="66" x2="576" y2="66" stroke="#172f2b" stroke-width="2"/>
    <g transform="translate(40,96)" fill="#2f6f63">
      <rect x="0" y="0" width="120" height="120" fill="none" stroke="#2f6f63" stroke-width="10"/>
      <rect x="24" y="24" width="30" height="30"/>
      <rect x="150" y="0" width="30" height="30"/><rect x="180" y="30" width="30" height="30"/><rect x="150" y="60" width="30" height="30"/><rect x="180" y="90" width="30" height="30"/>
      <rect x="0" y="150" width="30" height="30"/><rect x="60" y="150" width="30" height="30"/><rect x="30" y="180" width="30" height="30"/><rect x="90" y="180" width="30" height="30"/>
      <rect x="150" y="150" width="60" height="60" fill="none" stroke="#2f6f63" stroke-width="10"/>
    </g>
    <text x="290" y="150" fill="#5f716d" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-weight="700">Resolves to:</text>
    <text x="290" y="184" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="19">GTIN (product identity)</text>
    <text x="290" y="214" fill="#172f2b" font-family="'Source Sans 3', Arial, sans-serif" font-size="19">lot · batch · best-before</text>
    <line x1="24" y1="330" x2="576" y2="330" stroke="#c9c2b4" stroke-width="1.5"/>
    <text x="24" y="378" fill="#2f6f63" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" font-weight="700">→ Structured, records-backed data</text>
  </g>
  <text x="150" y="795" fill="#8a5a3b" font-family="'Source Sans 3', Arial, sans-serif" font-size="18">Scanning is not verification. Cross-check batch and dates against the printed panel; confirm recalls with official notices.</text>
</svg>
