<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Microwave-assisted freeze-drying</title>
  <desc id="desc">Comparison of shelf heat travelling inward through a dry layer and microwave energy heating within a frozen fruit piece. Both remove water by sublimation under vacuum; microwave power must be controlled to avoid hot spots and melt-back.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <rect x="64" y="64" width="1472" height="772" rx="30" fill="#fcfaf5" stroke="#d4c7b1" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="112" y="138" fill="#24433d" font-size="25" letter-spacing="5">TECHNOLOGY</text>
    <text x="112" y="207" fill="#172f2b" font-family="Georgia, serif" font-size="50">A different route for heat to reach the core</text>
    <text x="112" y="251" fill="#5f716d" font-size="24">Microwaves can accelerate sublimation. Control still sets the limit.</text>
    <rect x="112" y="298" width="658" height="408" rx="24" fill="#eef2f2" stroke="#ccd8d5" stroke-width="2"/>
    <rect x="802" y="298" width="678" height="408" rx="24" fill="#e9f1e7" stroke="#ccd8c9" stroke-width="2"/>
    <g fill="#24433d" font-size="29" font-weight="700"><text x="148" y="349">Conventional shelf heating</text><text x="838" y="349">Microwave-assisted heating</text></g>
    <g fill="#5f716d" font-size="22"><text x="148" y="385">Heat moves from the outside inward</text><text x="838" y="385">Energy is absorbed within the piece</text></g>
    <g stroke-width="4"><rect x="248" y="447" width="296" height="138" rx="27" fill="#d2ad8d" stroke="#ac8266"/><rect x="291" y="470" width="210" height="92" rx="18" fill="#b5d1e1" stroke="#8caec6"/>
      <rect x="998" y="447" width="296" height="138" rx="27" fill="#d2ad8d" stroke="#ac8266"/><rect x="1041" y="470" width="210" height="92" rx="18" fill="#b5d1e1" stroke="#8caec6"/></g>
    <g fill="#31536c" font-size="24" text-anchor="middle"><text x="396" y="526">Frozen core</text><text x="1146" y="526">Frozen core</text></g>
    <g fill="#8b654b" font-size="20"><text x="150" y="437">Dry layer</text><text x="842" y="437">Dry layer</text></g>
    <g fill="none" stroke="#c78e4e" stroke-width="7" stroke-linecap="round"><path d="M261 609h270M313 632v-37m-12 12 12-12 12 12M396 632v-37m-12 12 12-12 12 12M479 632v-37m-12 12 12-12 12 12"/></g>
    <g fill="#8b654b" font-size="21"><text x="289" y="670">Heat from the shelf</text></g>
    <g fill="none" stroke="#6b9a77" stroke-width="5" stroke-linecap="round"><path d="M852 474q17-24 34 0t34 0 34 0 34 0M852 518q17-24 34 0t34 0 34 0 34 0M852 562q17-24 34 0t34 0 34 0 34 0M1312 474q17-24 34 0t34 0 34 0M1312 518q17-24 34 0t34 0 34 0M1312 562q17-24 34 0t34 0 34 0"/></g>
    <g fill="none" stroke="#6e9ab7" stroke-width="3" stroke-linecap="round"><path d="M354 445v-32m-9 11 9-11 9 11M437 445v-32m-9 11 9-11 9 11M1105 445v-32m-9 11 9-11 9 11M1188 445v-32m-9 11 9-11 9 11"/></g>
    <text x="1040" y="630" fill="#24433d" font-size="23">Shorter heat-transfer path</text>
    <text x="1040" y="669" fill="#5f716d" font-size="21">Still frozen. Still under vacuum.</text>
    <rect x="112" y="736" width="1368" height="57" rx="17" fill="#17312f"/>
    <text x="145" y="773" fill="#fcfaf5" font-size="23">Control priorities: uniform heating · avoid hot spots and melt-back · manage low-pressure discharge</text>
  </g>
</svg>
